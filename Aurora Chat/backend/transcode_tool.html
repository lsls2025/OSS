<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>视频上传 · 本地预处理 · Aurora</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e6e6e6; line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  .card { background: #171a21; border: 1px solid #262b34; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .drop {
    border: 2px dashed #3a4250; border-radius: 12px; padding: 34px 16px; text-align: center;
    cursor: pointer; transition: .15s; color: #b8bec6;
  }
  .drop.hover { border-color: #4f8cff; background: #1b2230; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; align-items: center; }
  label { font-size: 13px; color: #c4cad2; display:block; margin-bottom:6px; }
  select, input[type=text], input[type=password], textarea {
    background: #0f1218; border: 1px solid #2c333d; color: #e6e6e6;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%;
  }
  textarea { resize: vertical; min-height: 56px; }
  .field { flex: 1 1 160px; min-width: 140px; }
  button {
    background: #4f8cff; color: #fff; border: 0; border-radius: 8px;
    padding: 11px 20px; font-size: 14px; cursor: pointer; transition: .15s;
  }
  button:disabled { background: #36404e; color: #888; cursor: not-allowed; }
  .progress { height: 12px; background: #0f1218; border-radius: 6px; overflow: hidden; margin-top: 16px; border: 1px solid #2c333d; display:none; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg,#4f8cff,#7b5cff); transition: width .2s; }
  .status { font-size: 14px; color: #cdd3db; margin-top: 12px; min-height: 22px; white-space: pre-wrap; word-break: break-all; }
  video { width: 100%; border-radius: 10px; background: #000; margin-top: 14px; max-height: 360px; display:none; }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  details summary { cursor: pointer; color: #cdd3db; font-size: 13px; }
  code { background: #0f1218; padding: 1px 6px; border-radius: 5px; color: #ffd479; }
</style>
</head>
<body>
<div class="wrap">
  <h1>视频上传</h1>
  <p class="sub">选择视频后，会在本设备上本地转码（旋转校正 · 分辨率封顶 · faststart），处理时页面显示「正在处理」与进度，处理完自动上传。</p>

  <div class="card">
    <details>
      <summary>高级设置</summary>
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:1 1 100%;">
          <label>服务器地址</label>
          <input id="server" type="text" />
        </div>
        <div class="field" id="tokenField" style="flex:1 1 100%;">
          <label>登录令牌</label>
          <input id="token" type="password" placeholder="可选" />
        </div>
        <div class="field">
          <label>分辨率封顶（最长边）</label>
          <select id="maxh">
            <option value="720">720P（最省体积）</option>
            <option value="1080" selected>1080P（推荐）</option>
            <option value="1440">1440P</option>
            <option value="2160">不限制（原分辨率）</option>
          </select>
        </div>
        <div class="field">
          <label>质量（CRF，越小越清晰越大）</label>
          <select id="crf">
            <option value="18">18 几乎无损</option>
            <option value="23" selected>23 默认</option>
            <option value="28">28 更小</option>
          </select>
        </div>
        <div class="field" style="flex:1 1 220px;">
          <label style="display:flex;align-items:center;gap:8px;margin-top:22px;">
            <input id="fast" type="checkbox" style="width:auto;" /> 极速模式（源已是 H.264/AAC 时仅换封装，秒级；不校正旋转）
          </label>
        </div>
      </div>
    </details>
  </div>

  <div class="card">
    <div id="drop" class="drop">
      <div style="font-size:15px;">点击选择视频，或拖拽到这里</div>
      <div class="hint">支持 mp4 / mov / mkv / webm 等常见格式</div>
    </div>
    <input id="file" type="file" accept="video/*" hidden />
    <div class="progress" id="prog"><div id="bar"></div></div>
    <div id="status" class="status"></div>
    <video id="preview" controls></video>
    <div class="row" id="dlRow" style="display:none;">
      <a id="dl" download="aurora_clean.mp4"><button type="button">下载成品（备用）</button></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const FFmpegNS = window.FFmpeg;
const { fetchFile, toBlobURL } = window.FFmpegUtil;
let ffmpeg = null;
let outBlob = null;
const $ = id => document.getElementById(id);

function setStatus(t, cls) { const el = $('status'); el.textContent = t; el.className = 'status' + (cls ? ' ' + cls : ''); }
function setBar(pct) { $('prog').style.display = 'block'; $('bar').style.width = Math.max(0, Math.min(100, Math.round(pct))) + '%'; }

async function ensureFFmpeg() {
  if (ffmpeg) return;
  if (!FFmpegNS || !FFmpegNS.FFmpeg) { throw new Error('ffmpeg 脚本未加载，请检查网络是否能访问 cdn.jsdelivr.net'); }
  ffmpeg = new FFmpegNS.FFmpeg();
  ffmpeg.on('progress', ({ progress }) => { if (progress >= 0 && progress <= 1) setBar(progress * 80); });
  setStatus('正在加载本地转码核心（ffmpeg.wasm，约 30MB，首次需联网）…');
  const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/';
  await ffmpeg.load({
    coreURL: await toBlobURL(base + 'ffmpeg-core.js', 'text/javascript'),
    wasmURL: await toBlobURL(base + 'ffmpeg-core.wasm', 'application/wasm'),
  });
}

function pickFile(f) {
  if (!f) return;
  if (!f.type.startsWith('video/') && !/\.(mp4|mov|mkv|webm|avi|flv|m4v)$/i.test(f.name)) { setStatus('请选择视频文件。', 'err'); return; }
  setStatus('已选择：' + f.name + '（' + (f.size/1048576).toFixed(1) + ' MB），开始处理…');
  run(f);
}

$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => pickFile(e.target.files[0]));
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hover'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hover'); }));
$('drop').addEventListener('drop', e => pickFile(e.dataTransfer.files[0]));

$('server').value = location.origin;

// 从 App 打开时，令牌通过 URL 片段（#t=...）自动带入：不经过服务器、不留痕、用户无感。
// 优先用片段里的令牌；没有（用户直接打开网页）才退回手动输入。
function tokenFromUrl() {
  const m = location.hash.match(/[#&]t=([^&]+)/);
  if (m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
  return '';
}
(function () {
  const t = tokenFromUrl();
  if (t) {
    $('token').value = t;
    $('tokenField').style.display = 'none';
  }
})();

async function run(f) {
  $('drop').style.pointerEvents = 'none';
  try {
    await ensureFFmpeg();
    setStatus('正在处理（本地转码中）… 0%');
    const ext = (f.name.split('.').pop() || 'mp4').toLowerCase();
    const inName = 'input.' + ext;
    await ffmpeg.writeFile(inName, await fetchFile(f));

    const maxH = $('maxh').value === '2160' ? 100000 : parseInt($('maxh').value, 10);
    const crf = $('crf').value;
    const fast = $('fast').checked;
    let args;
    if (fast) {
      args = ['-i', inName, '-c', 'copy', '-movflags', '+faststart', 'output.mp4'];
    } else {
      args = ['-i', inName, '-vf', `scale='min(${maxH},iw)':-2:force_original_aspect_ratio=decrease,format=yuv420p,setsar=1`,
        '-c:v', 'libx264', '-preset', 'veryfast', '-crf', crf, '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', 'output.mp4'];
    }

    setBar(5);
    await ffmpeg.exec(args);
    const data = await ffmpeg.readFile('output.mp4');
    outBlob = new Blob([data], { type: 'video/mp4' });
    const url = URL.createObjectURL(outBlob);
    $('preview').src = url; $('preview').style.display = 'block';
    $('dl').href = url; $('dlRow').style.display = 'flex';
    setBar(90);

    const token = tokenFromUrl() || $('token').value.trim();
    if (!token) {
      setStatus('处理完成 ✅ 已生成标准 H.264 成品。未填令牌，无法直传——请下载后用 Aurora App 上传（同样零转码）。', 'ok');
      return;
    }

    setStatus('本地处理完成，正在上传到服务器…');
    const server = $('server').value.replace(/\/+$/, '');
    const fd = new FormData();
    fd.append('file', outBlob, 'aurora_clean.mp4');
    fd.append('title', ''); fd.append('description', '');
    const resp = await fetch(server + '/api/shortvideo/upload', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd
    });
    const j = await resp.json().catch(() => ({}));
    if (resp.ok && j && (j.code === 200 || j.status === 200)) {
      setBar(100);
      setStatus('完成 ✅ 视频已发布（id=' + (j.data && j.data.id) + '），服务器零重编码直通。', 'ok');
    } else {
      setStatus('本地处理完成，但上传返回：' + JSON.stringify(j) + '。请改用「下载成品」用 App 上传。', 'err');
    }
  } catch (err) {
    console.error(err);
    setStatus('处理失败：' + (err && err.message ? err.message : err), 'err');
  } finally {
    $('drop').style.pointerEvents = 'auto';
    try { await ffmpeg.deleteFile('input.' + (f.name.split('.').pop()||'mp4').toLowerCase()); } catch(e){}
    try { await ffmpeg.deleteFile('output.mp4'); } catch(e){}
  }
}
</script>
</body>
</html>
