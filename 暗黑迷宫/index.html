        })();

        // 绕 Y 轴旋转后的墙体 AABB：本工程只用 0 / ±90°，该公式与 Box3.setFromObject 的结果一致
        function wallBoxOf(x, z, w, d, rot) {
            const c = Math.abs(Math.cos(rot)), s = Math.abs(Math.sin(rot));
            const hx = (c * w + s * d) / 2, hz = (s * w + c * d) / 2;
            return { minX: x - hx, maxX: x + hx, minZ: z - hz, maxZ: z + hz };
        }

        // 把一批墙体合批成「1 个 Mesh（可实例化）+ 1 个 LineSegments」，并返回碰撞盒列表
        function buildWallBatch(specs, mat, lineMat) {
            const n = specs.length;
            const lineArr = new Float32Array(n * EDGE_POS.length);
            const boxes = [];
            const grp = new THREE.Group();
            const inst = canInstance ? new THREE.InstancedMesh(UNIT_BOX, mat, Math.max(1, n)) : null;
            if (inst) { inst.count = n; inst.castShadow = true; inst.receiveShadow = true; inst.frustumCulled = false; grp.add(inst); }
            const mtx = new THREE.Matrix4();
            const quat = new THREE.Quaternion();
            const vPos = new THREE.Vector3();
            const vScl = new THREE.Vector3();
            for (let i = 0; i < n; i++) {
                const s = specs[i];
                const rot = s.rot || 0;
                const cos = Math.cos(rot), sin = Math.sin(rot);
                vPos.set(s.x, WALL_HEIGHT / 2, s.z);
                quat.setFromAxisAngle(Y_AXIS, rot);
                vScl.set(s.w, WALL_HEIGHT, s.d);
                mtx.compose(vPos, quat, vScl);
                if (inst) {
                    inst.setMatrixAt(i, mtx);
                } else {
                    const single = new THREE.Mesh(UNIT_BOX, mat);
                    single.position.copy(vPos);
                    single.quaternion.copy(quat);
                    single.scale.copy(vScl);
                    single.castShadow = true;
                    single.receiveShadow = true;
                    grp.add(single);
                }
                const off = i * EDGE_POS.length;
                for (let k = 0; k < EDGE_POS.length; k += 3) {
                    const lx = EDGE_POS[k] * s.w, ly = EDGE_POS[k + 1] * WALL_HEIGHT, lz = EDGE_POS[k + 2] * s.d;
                    lineArr[off + k] = s.x + lx * cos + lz * sin;
                    lineArr[off + k + 1] = WALL_HEIGHT / 2 + ly;
                    lineArr[off + k + 2] = s.z - lx * sin + lz * cos;
                }
                boxes.push(wallBoxOf(s.x, s.z, s.w, s.d, rot));
            }
            if (inst) inst.instanceMatrix.needsUpdate = true;
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(lineArr, 3));
            const lines = new THREE.LineSegments(lineGeo, lineMat);
            lines.frustumCulled = false;
            grp.add(lines);
            return { group: grp, boxes };
        }

        // ---- 收集迷宫内墙（去重：相邻两格共用的那面墙只建一根）----
        // 原实现对每格的 4 面墙各建一根，相邻格之间的墙会被两边各建一次 → 几何量与碰撞盒都直接翻倍。
        // 规则：每格只建"北墙(0)"和"西墙(3)"（顶行 / 最左列的外墙正好在此覆盖），
        //       末行补"南墙(2)"、末列补"东墙(1)"。这样每面墙恰好被建一次，画面与碰撞完全等价。
        const mazeWalls = [];
        const pushWall = (cx, cz, dx, dz, rot) => {
            mazeWalls.push({ x: cx + dx * half, z: cz + dz * half, w: CELL_SIZE, d: WALL_THICK, rot });
        };
        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                const cell = mazeGrid[row][col];
                const cx = col * CELL_SIZE + half - 0.5;
                const cz = row * CELL_SIZE + half - 0.5;
                if (cell.walls[0]) pushWall(cx, cz, 0, -1, 0);                              // 北
                if (cell.walls[3]) pushWall(cx, cz, -1, 0, Math.PI / 2);                    // 西
                if (row === SIZE - 1 && cell.walls[2]) pushWall(cx, cz, 0, 1, 0);           // 末行：南外墙
                if (col === SIZE - 1 && cell.walls[1]) pushWall(cx, cz, 1, 0, Math.PI / 2); // 末列：东外墙
            }
        }

        // ---- 地板格：同一材质 → 1 个 InstancedMesh（原为 144 个独立 Mesh）----
        {
            const floorGeo = new THREE.PlaneGeometry(CELL_SIZE * 0.98, CELL_SIZE * 0.98);
            const floorQuat = new THREE.Quaternion().setFromAxisAngle(X_AXIS, -Math.PI / 2);
            const one = new THREE.Vector3(1, 1, 1);
            const ftPos = new THREE.Vector3();
            const ftMtx = new THREE.Matrix4();
            if (canInstance) {
                const floorTiles = new THREE.InstancedMesh(floorGeo, floorMat, SIZE * SIZE);
                floorTiles.receiveShadow = true;
                floorTiles.frustumCulled = false;
                let idx = 0;
                for (let row = 0; row < SIZE; row++) {
                    for (let col = 0; col < SIZE; col++) {
                        ftPos.set(col * CELL_SIZE + half - 0.5, 0, row * CELL_SIZE + half - 0.5);
                        ftMtx.compose(ftPos, floorQuat, one);
                        floorTiles.setMatrixAt(idx++, ftMtx);
                    }
                }
                floorTiles.instanceMatrix.needsUpdate = true;
                mazeDecorGroup.add(floorTiles);
            } else {
                for (let row = 0; row < SIZE; row++) {
                    for (let col = 0; col < SIZE; col++) {
                        const tile = new THREE.Mesh(floorGeo, floorMat);
                        tile.rotation.x = -Math.PI / 2;
                        tile.position.set(col * CELL_SIZE + half - 0.5, 0, row * CELL_SIZE + half - 0.5);
                        tile.receiveShadow = true;
                        mazeDecorGroup.add(tile);
                    }
                }
            }
        }

        // ---- 合批入组（迷宫墙）----
        const mazeWallBatch = buildWallBatch(mazeWalls, wallMat, new THREE.LineBasicMaterial({ color: 0x3a2a1a }));
        wallGroup.add(mazeWallBatch.group);
        WALL_BOXES.set(wallGroup, mazeWallBatch.boxes);

        scene.add(wallGroup);

        // 入口
        const entryMat = new THREE.MeshStandardMaterial({ color: 0x3d9e3d, emissive: 0x1a6b1a, emissiveIntensity: 0.3 });
        const entryBlock = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.5), entryMat);
        entryBlock.position.set(0.5, 0.1, 0.5);
        mazeDecorGroup.add(entryBlock);

        // 出口
        const exitMat = new THREE.MeshStandardMaterial({
            color: 0xff4d4d,
            emissive: 0xff2222,
            emissiveIntensity: 0.4,
            transparent: true,
            opacity: 0.9
        });
        // 两个出口各放一套标记（红块 + 红光束），共用材质；
        // ⚠ 光柱要收进数组：动画循环里要逐个转，别再像以前那样引用循环内的局部变量（会黑屏）
        const glowMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 0.6, transparent: true, opacity: 0.25 });
        const exitPillars = [];
        for (const e of EXITS) {
            const exitWorldX = e.x * CELL_SIZE + half - 0.5;
            const exitWorldZ = e.y * CELL_SIZE + half - 0.5;
            const exitBlock = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.6), exitMat);
            exitBlock.position.set(exitWorldX, 0.1, exitWorldZ);
            mazeDecorGroup.add(exitBlock);
            const glowPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 2.0, 8), glowMat);
            glowPillar.position.set(exitWorldX, 1.2, exitWorldZ);
            mazeDecorGroup.add(glowPillar);
            exitPillars.push(glowPillar);
        }

        // 玩家
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xf7d44a, emissive: 0x553311, emissiveIntensity: 0.1 });
        const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), playerMat);
        playerMesh.castShadow = true;
        scene.add(playerMesh);

        // ---- 角色身体：用所选角色图做成立牌式贴图身体（面朝相机，真正带上形象）----
        const bodyTex = new THREE.Texture(); // 初始透明
        const bodyMat = new THREE.SpriteMaterial({ map: bodyTex, transparent: true, depthTest: true, depthWrite: false });
        const bodySprite = new THREE.Sprite(bodyMat);
        // 立牌用方形（与方形角色图比例一致，避免拉伸变形）。中心 y = 尺寸/2 → 图片底部正好
        // 贴在地面(y=0)上，既不离地也不"陷进地里"。
        bodySprite.scale.set(BODY_SIZE, BODY_SIZE, 1);
        bodySprite.position.y = BODY_CENTER_Y;
        bodySprite.visible = false; // 本机不显示自己的立牌（不挡视野），仅由队友渲染看到

        // 用角色立牌代替方块身体（碰撞检测基于墙体，不受影响）
        playerMesh.visible = false;

        // ================= 鬼「变身」特效 =================
        // 前摇 2 秒：身上大量红光闪烁；2 秒到点才真正换立牌图（不再是瞬间变身）。
        // 变身后：保留很弱的闪光（"身上微微冒光"），但刻意做得极省。
        // 性能设计（你特别强调过）：
        //   ① 每个玩家只有一个 THREE.Points（48 粒子）= 1 个 draw call；空闲时 visible=false，一个都不画；
        //   ② 加法混合：粒子"淡出"就是把颜色乘到 0（黑=不可见）→ 不需要 alpha、也不用挪走死粒子；
        //   ③ 全程不加任何灯光 —— 加灯会让全场材质重新编译（卡顿）+ 每像素多算一盏灯。
        const TRANSFORM_MS = 2000;   // 前摇时长兜底值（服务端会在 ghostfx 里下发权威 ms）
        const FX_POOL = 340;         // 粒子池大小：粒子越小越要多；340 粒仍然只占 1 个 draw call
        const FX_HEAVY_RATE = 420;   // 前摇期间每秒喷出的粒子数（"大量红光"）
        const FX_IDLE_RATE = 9;      // 变身后的微弱闪光（每秒粒子数，刻意很低）
        const sparkTex = (function () {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const g = c.getContext('2d');
            const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.28, 'rgba(255,96,84,0.8)');
            grd.addColorStop(1, 'rgba(255,0,0,0)');
            g.fillStyle = grd;
            g.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        })();
        function makeFx() {
            const pos = new Float32Array(FX_POOL * 3);
            const col = new Float32Array(FX_POOL * 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const pts = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.13, map: sparkTex, vertexColors: true, transparent: true,
                depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
            }));
            pts.frustumCulled = false; // 每帧手动定位，交给引擎剔除反而会闪
            pts.matrixAutoUpdate = false; // 位置全写在顶点里（世界坐标）→ 省掉每帧的矩阵计算
            pts.visible = false;       // 空闲时一个 draw call 都不花
            scene.add(pts);
            const st = [];
            for (let i = 0; i < FX_POOL; i++) st.push({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, t: 0, life: 0, r: 0, g: 0, b: 0 });
            return { pts, pos, col, st, idx: 0, acc: 0, dirty: false };
        }
        function fxEmit(fx, x, y, z, speed, life) {
            const p = fx.st[fx.idx];
            fx.idx = (fx.idx + 1) % FX_POOL; // 环形复用：池满就顶掉最旧的，永远不会爆
            const a = Math.random() * Math.PI * 2;
            const rr = 0.16 + Math.random() * 0.5; // 粒子小了 → 散布放大一点，才像"一片红光"
            p.x = x + Math.cos(a) * rr;
            p.y = y + (Math.random() - 0.15) * 1.05;
            p.z = z + Math.sin(a) * rr;
            p.vx = Math.cos(a) * speed * (0.35 + Math.random() * 0.9);
            p.vz = Math.sin(a) * speed * (0.35 + Math.random() * 0.9);
            p.vy = speed * (0.35 + Math.random() * 1.1);
            p.t = 0; p.life = life;
            const warm = Math.random() < 0.3; // 少量偏橙白 → "闪闪"的层次感
            p.r = 1; p.g = warm ? 0.6 : 0.16; p.b = warm ? 0.4 : 0.1;
        }
        function fxStep(fx, dt, vis) {
            const v = vis == null ? 1 : vis; // 0 = 没被照到 / 被墙挡住 → 整团都不显示
            let alive = false;
            for (let i = 0; i < FX_POOL; i++) {
                const p = fx.st[i], o = i * 3;
                if (p.t >= p.life) {
                    if (fx.col[o] !== 0 || fx.col[o + 1] !== 0 || fx.col[o + 2] !== 0) {
                        fx.col[o] = fx.col[o + 1] = fx.col[o + 2] = 0; fx.dirty = true;
                    }
                    continue;
                }
                p.t += dt; alive = true;
                p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
                p.vy -= 1.5 * dt;                  // 轻微重力：先窜上去再慢慢落
                const g = (1 - p.t / p.life) * v;  // 淡出 × 光照可见度（加法混合下变黑即消失）
                fx.pos[o] = p.x; fx.pos[o + 1] = p.y; fx.pos[o + 2] = p.z;
                fx.col[o] = p.r * g; fx.col[o + 1] = p.g * g; fx.col[o + 2] = p.b * g;
                fx.dirty = true;
            }
            if (fx.dirty) {
                fx.pts.geometry.attributes.position.needsUpdate = true;
                fx.pts.geometry.attributes.color.needsUpdate = true;
                fx.dirty = false;
            }
            const show = alive && v > 0;
            if (fx.pts.visible !== show) fx.pts.visible = show;
            return show;
        }
        // 立刻结束全部粒子（关灯时用：绝不让粒子在漆黑里自己发光）
        function fxKill(fx) {
            for (let i = 0; i < FX_POOL; i++) fx.st[i].t = fx.st[i].life;
        }
        // 每帧推进：lit=本人手电是否开着（关灯就没有粒子）· heavy=前摇 · idle=变身后的微弱闪光
        function fxPump(fx, x, y, z, dt, lit, heavy, idle, vis) {
            if (!lit) {
                // 关灯：粒子立即清空；本来就空的直接返回，一个循环都不跑
                if (!fx.pts.visible) return;
                fxKill(fx);
                fx.acc = 0;
                fxStep(fx, dt, 0);
                return;
            }
            const rate = heavy ? FX_HEAVY_RATE : (idle ? FX_IDLE_RATE : 0);
            if (rate > 0) {
                fx.acc += rate * dt;
                let n = fx.acc | 0;
                if (n > 24) n = 24;           // 单帧上限：掉帧时也不会一次喷爆
                fx.acc -= n;
                for (let i = 0; i < n; i++) fxEmit(fx, x, y, z, heavy ? 2.4 : 0.5, heavy ? 0.8 : 1.2);
            } else if (!fx.pts.visible && !vis) {
                return;                       // 空闲且不可见（无粒子、不发射、也没被照到）：连 fxStep 都不跑
            } else {
                fx.acc = 0;
            }
            fxStep(fx, dt, vis);
        }
        const selfFx = makeFx(); // 本机玩家的粒子池

        // ---- 粒子可见性：完全照抄人物立牌那套规则 —— "被照到 + 我看得见"才显示 ----
        // 之前粒子是自发光（加法混合），所以关着灯、隔着墙都能看见一团红光，与立牌规则矛盾。
        // 现在每帧只对"正在冒粒子的玩家"算一次（不是逐粒子），开销可忽略。
        const GRID_OFF = half - 0.5; // 世界坐标 ↔ 格坐标：g = (w - GRID_OFF) / CELL_SIZE
        // 沿世界坐标线段走迷宫网格（DDA），穿过带墙的格线 → 视线被挡
        function wallBetween(wx0, wz0, wx1, wz1) {
            const rx = wx1 - wx0, rz = wz1 - wz0;
            if (rx * rx + rz * rz < 1e-6) return false; // 同一个点（例如相机=自己的身体）→ 不可能被挡
            const gx = (wx0 - GRID_OFF) / CELL_SIZE, gz = (wz0 - GRID_OFF) / CELL_SIZE;
            const tx = (wx1 - GRID_OFF) / CELL_SIZE, tz = (wz1 - GRID_OFF) / CELL_SIZE;
            const dx = tx - gx, dz = tz - gz;
            let cx = Math.round(gx), cz = Math.round(gz); // 格心落在整数坐标上
            const sx = dx > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
            let tMaxX = dx === 0 ? Infinity : ((cx + 0.5 * sx) - gx) / dx;
            let tMaxZ = dz === 0 ? Infinity : ((cz + 0.5 * sz) - gz) / dz;
            const dX = dx === 0 ? Infinity : 1 / Math.abs(dx);
            const dZ = dz === 0 ? Infinity : 1 / Math.abs(dz);
            for (let i = 0; i < 160; i++) {
                if (tMaxX < tMaxZ) {
                    // 穿过竖直格线：该格相应方向的墙（1=东 3=西）
                    const cell = mazeGrid[cz] && mazeGrid[cz][cx];
                    if (cell && cell.walls[sx > 0 ? 1 : 3]) return true;
                    cx += sx; tMaxX += dX;
                } else {
                    // 穿过水平格线：0=北 2=南
                    const cell = mazeGrid[cz] && mazeGrid[cz][cx];
                    if (cell && cell.walls[sz > 0 ? 2 : 0]) return true;
                    cz += sz; tMaxZ += dZ;
                }
                if (tMaxX > 1 && tMaxZ > 1) return false;                        // 已到终点
                if (cx < -1 || cz < -1 || cx > SIZE || cz > SIZE) return false;  // 出了迷宫（广场没墙）
            }
            return false;
        }
        // 一盏聚光灯对某点的照亮强度（距离衰减 × 锥角，形状与 three 的 spot 一致）
        function spotFactor(light, x, y, z) {
            const px = light.position.x, py = light.position.y, pz = light.position.z;
            const dx = x - px, dy = y - py, dz = z - pz;
            const cut = light.distance || 45;
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (d > cut) return 0;
            const dec = light.decay || 0.35;
            const att = Math.pow(Math.max(1 - d / cut, 0), dec) / Math.max(Math.pow(Math.max(d, 0.01), dec), 0.01);
            const tg = light.target && light.target.position;
            let cosA = 1;
            if (tg) {
                const ax = tg.x - px, ay = tg.y - py, az = tg.z - pz;
                const al = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
                cosA = (dx * ax + dy * ay + dz * az) / (Math.max(d, 0.0001) * al);
            }
            const ang = light.angle || 0.6;
            const outer = Math.cos(ang);
            const inner = Math.cos(ang * (1 - (light.penumbra != null ? light.penumbra : 1)));
            let t = (cosA - outer) / Math.max(inner - outer, 1e-4);
            t = t < 0 ? 0 : (t > 1 ? 1 : t);
            return att * (t * t * (3 - 2 * t));
        }
        // 一团粒子此刻该有多亮：0 = 完全不显示（没人照到 / 被墙挡住看不见）
        function cloudBrightness(x, y, z, ownLightOn, ownerId) {
            if (wallBetween(camera.position.x, camera.position.z, x, z)) return 0; // 我看不见 → 不显示
            let L = ownLightOn ? 1 : 0; // 他自己的手电就在身边：灯亮即等于被照亮
            if (flashOn) L += spotFactor(flashLight, x, y, z) * 2.5;
            for (const r of REMOTE.values()) {
                if (r.id === ownerId || !r.flash || !r.rLight) continue;
                if (wallBetween(r.rLight.position.x, r.rLight.position.z, x, z)) continue;
                L += spotFactor(r.rLight, x, y, z) * 2.5;
            }
            return L <= 0 ? 0 : (L > 1 ? 1 : L);
        }

        let px = 0.5, pz = 0.5;
        // 出生朝向：cell(0,0) 只打通了东/南两面（clearWalls），默认 yaw=0 朝北会正对实心外墙+
        // 天花板，画面像"抬起头"盯着墙。改成朝东(-PI/2)正对打通的走廊，出生即看到前方通道。
        // 俯仰保持 0（水平/平行），不改动。
        let playerAngle = -Math.PI / 2;
        let pitchAngle = 0;
        let escaped = false; // 是否已离开（成功走出）迷宫

        // 热点函数（移动时每帧调用）：缓存 DOM 引用、复用 Euler，避免每帧 getElementById（老设备很贵）
        const _euler = new THREE.Euler(0, 0, 0, 'YXZ');

        function updatePlayerPosition() {
            const wx = px * CELL_SIZE + half - 0.5;
            const wz = pz * CELL_SIZE + half - 0.5;
            playerMesh.position.set(wx, 0.3 + yOffset, wz);
            camera.position.set(wx, 1.5 + yOffset, wz);
            bodySprite.position.set(wx, BODY_CENTER_Y + yOffset, wz);
            _euler.set(pitchAngle, playerAngle, 0, 'YXZ');
            camera.quaternion.setFromEuler(_euler);
            // 走出迷宫判定：两个出口任意一个都算（0.3 格内；用平方比较，省掉每帧两次开方）
            if (!escaped) {
                for (let i = 0; i < EXITS.length; i++) {
                    const dx = px - EXITS[i].x, dz = pz - EXITS[i].y;
                    if (dx * dx + dz * dz < 0.09) {
                        escaped = true;
                        // 成功走出迷宫：取消本地"离开迷宫"提示，改为向所有人广播
                        if (MY_WS && MY_WS.readyState === 1) MY_WS.send(JSON.stringify({ type: 'escape' }));
                        // 逃脱：先显示 5 秒过渡界面，倒计时结束才回预备房（服务端此刻已把玩家移回 prep）
                        showTransition('你已逃出生天', 'win');
                        break;
                    }
                }
            }
        }
        updatePlayerPosition();

        // 碰撞检测（当前地图的可移动格坐标范围）
        function curMin() { return MOVE_MIN; }
        function curMax() { return MOVE_MAX; }
        function canMoveTo(nx, nz) {
            if (noclip) return true;
            if (nx < curMin() || nx > curMax() || nz < curMin() || nz > curMax()) return false;
            // 高度高于墙顶时允许飞越（连跳场景），仅在墙顶以下才受墙阻挡
            const airborneOver = yOffset > WALL_HEIGHT;
            if (airborneOver) return true;
            const testX = nx * CELL_SIZE + half - 0.5;
            const testZ = nz * CELL_SIZE + half - 0.5;
            const radius = PLAYER_RADIUS;
            for (const bx of WALL_BOXES.get(wallGroup) || EMPTY_BOXES) {
                if (testX >= bx.minX - radius && testX <= bx.maxX + radius &&
                    testZ >= bx.minZ - radius && testZ <= bx.maxZ + radius) {
                    return false;
                }
            }
            return true;
        }
        // 世界坐标版碰撞判定：点 (wx, wz) 是否被墙挡住（用于远程玩家平滑移动/击退撞墙停止）
        function worldBlocked(wx, wz) {
            if (noclip) return false;
            const radius = PLAYER_RADIUS;
            for (const bx of WALL_BOXES.get(wallGroup) || EMPTY_BOXES) {
                if (wx >= bx.minX - radius && wx <= bx.maxX + radius &&
                    wz >= bx.minZ - radius && wz <= bx.maxZ + radius) {
                    return true;
                }
            }
            return false;
        }

        // ============================================================
        // 桌面控制：移动由 WASD 按键驱动 (keys)，视角由 Pointer Lock 鼠标驱动
        // ============================================================

        // 窗口自适应
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ===== 游戏循环 =====
        const clock = new THREE.Clock();
        let time = 0;
        // 复用临时向量：避免每帧 new/clone 造成 GC 抖动（老设备上会直接表现为掉帧）
        const _forward = new THREE.Vector3();
        const _right = new THREE.Vector3();
        const _moveVec = new THREE.Vector3();
        // 手电筒复用向量
        const _fwdR = new THREE.Vector3();
        const _cameraDir = new THREE.Vector3();
        const rLightPos = new THREE.Vector3();
        // 远端手电筒俯仰复用（与本地相机同一套 Euler 'YXZ' 规则，保证抬头/低头一致）
        const _rEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        const _rQuat = new THREE.Quaternion();
        // 远端位置"吸附阈值"：目标距离超过 4 格（6 世界单位）视为复活/传送/长时间丢包，直接吸附而不插值
        const REMOTE_SNAP_DIST2 = (CELL_SIZE * 4) * (CELL_SIZE * 4);
        // ---- FPS 统计：每 0.5s 刷新一次左下角帧率 ----
        let fpsEl = document.getElementById('fpsInfo');
        let fpsFrames = 0, fpsLast = clock.elapsedTime;
        let lastRenderAt = 0; // 上次真正重绘的时刻（限制重绘帧率，高刷屏下省一半 GPU 开销）

        function animate() {
            try {
                _animateFrame();
            } catch (err) {
                // 防御护栏：单帧异常不中断循环（否则画面永久卡死、人物残留原地）。
                // 打印具体报错，方便定位真正根因；循环继续下一帧。
                try {
                    console.error('[animate error]', err && err.stack ? err.stack : err);
                    const h = document.getElementById('statusHint');
                    if (h && h.textContent.indexOf('animate error') < 0) h.textContent = 'animate error: ' + (err && err.message || err);
                } catch (e2) {}
            }
            requestAnimationFrame(animate);
        }
        function _animateFrame() {
            const delta = Math.min(clock.getDelta(), 0.05);
            time += delta;

            const et = clock.elapsedTime;
            if (et - fpsLast >= 0.5) {
                const fps = Math.round(fpsFrames / (et - fpsLast));
                fpsEl.textContent = fps + ' FPS';
                fpsFrames = 0; fpsLast = et;
                maybeAutoDowngrade(fps); // 低配设备自动降档兜底
            }

            // 出口标记呼吸 + 光柱旋转（两个出口共用同一份材质，所以材质只改一次，旋转逐个来）
            exitMat.emissiveIntensity = 0.3 + 0.4 * Math.sin(time * 3);
            glowMat.opacity = 0.15 + 0.25 * Math.sin(time * 2.5 + 0.5);
            for (let i = 0; i < exitPillars.length; i++) exitPillars[i].rotation.y += delta * 0.6;

            // 垂直物理（空格跳跃 + 重力 + 连跳持续上升）
            if (!moveLocked() && bhop && spaceHeld) {
                // 连跳：按住空格持续稳定上升（不靠重力），速度平稳、他人视角随高度平滑跟随；上限悬停
                if (yOffset < BHOP_MAX_HEIGHT) {
                    vy = BHOP_CLIMB;
                    yOffset += vy * delta;
                } else {
                    vy = 0; // 到顶后保持悬停，松开空格即自由下落
                }
                groundedRef = false;
                camera.position.y = 1.5 + yOffset;
                playerMesh.position.y = 0.3 + yOffset;
            } else if (!groundedRef) {
                vy -= GRAVITY * delta;
                yOffset += vy * delta;
                if (yOffset <= 0) { yOffset = 0; vy = 0; groundedRef = true; }
                camera.position.y = 1.5 + yOffset;
                playerMesh.position.y = 0.3 + yOffset;
            }

            // WASD 移动（全员锁定时禁止移动，仅保留视角翻转）
            const fwd = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);   // 前 +1 / 后 -1
            const strafe = (keys.d ? 1 : 0) - (keys.a ? 1 : 0); // 右 +1 / 左 -1
            let running = false; // 本帧是否在奔跑（体力推进在移动分支之外，需要这个标志）
            if (!moveLocked() && (fwd !== 0 || strafe !== 0)) {
                // 复用临时向量，避免每帧 new + clone（老设备上 GC 抖动会直接表现为掉帧）
                _forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
                _forward.y = 0;
                _forward.normalize();
                _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
                _right.y = 0;
                _right.normalize();

                const moveVec = _moveVec.set(0, 0, 0)
                    .addScaledVector(_forward, fwd)
                    .addScaledVector(_right, strafe);
                moveVec.y = 0;
                const len = moveVec.length();
                const moving = len > 0.01;
                // 体力：仅"真正移动 + 按住 Shift + 未力竭 + 仍有体力"才算奔跑（用于加速与消耗）
                running = sprintKey && moving && stamina > STAMINA_SPRINT_MIN;
                // 滞空水平加速：离地期间（含连跳）水平移速 × AIR_SPEED_MULT，与奔跑乘算叠加，
                // 让"按住 Shift 边跑边跳"成为略快于纯跑的走法（幅度温和，不会快得离谱）。
                const airMult = groundedRef ? 1 : AIR_SPEED_MULT;
                if (moving) {
                    moveVec.normalize();
                    const speed = PLAYER_SPEED * speedMult * (running ? 1.5 : 1) * airMult * delta;
                    const step = 0.04;
                    const steps = Math.ceil(speed / step);
                    const stepSize = speed / steps;
                    let newPx = px, newPz = pz;
                    for (let i = 0; i < steps; i++) {
                        const testX = newPx + moveVec.x * stepSize / CELL_SIZE;
                        const testZ = newPz + moveVec.z * stepSize / CELL_SIZE;
                        if (canMoveTo(testX, testZ)) {
                            newPx = testX;
                            newPz = testZ;
                        } else {
                            const canX = canMoveTo(testX, newPz);
                            const canZ = canMoveTo(newPx, testZ);
                            if (canX) newPx = testX;
                            if (canZ) newPz = testZ;
                            if (!canX && !canZ) break;
                        }
                    }
                    px = Math.max(curMin() + 0.01, Math.min(curMax() - 0.01, newPx));
                    pz = Math.max(curMin() + 0.01, Math.min(curMax() - 0.01, newPz));
                    updatePlayerPosition();
                }
            }
            // 体力推进：⚠ 必须放在移动分支之外（每帧都跑）。
            // 之前写在"有移动输入"的分支里 → 站着不动永远不恢复（必须一直走路才回体力）。
            if (staminaUnlimited) {
                stamina = STAMINA_MAX;
            } else if (running) {
                stamina -= STAMINA_DRAIN_PER_SEC * delta;
                if (stamina <= 0) stamina = 0; // 跑空即停止奔跑（本帧起 running 变 false，转为恢复）
            } else {
                // 未奔跑（站着、走着但没按 Shift、或力竭恢复中）：立即恢复
                stamina = Math.min(STAMINA_MAX, stamina + STAMINA_RECOVER_PER_SEC * delta);
            }
            updateStaminaUI(stamina);

            // 远程玩家：平滑移动到各自目标（含击退滑动、撞墙停止），并朝向玩家自己的角度
            const remK = 1 - Math.exp(-10 * delta); // 每帧只算一次（所有远端共用，省掉重复的 exp）
            // 立牌可见性完全由「真实材质 × 真实光照」决定（见 makeRemote 的 onBeforeCompile）。
            // 便宜的剔除：全场一盏手电都没开时，所有立牌必然全透明 → 直接不画（省绘制与逐像素计算）。
            let anyLightOn = flashOn;
            if (!anyLightOn) { for (const r of REMOTE.values()) { if (r.flash) { anyLightOn = true; break; } } }
            // 爆点生效中：狼人（鬼）与发起者本人可见；单爆时只有被点名的那个人发光
            const revealActive = revealUntil > performance.now() && (myGhost || revealByMe);
            for (const r of REMOTE.values()) {
                const revealOn = revealActive && (!revealTargetId || revealTargetId === r.id);
                const dxT = r.tx - r.body.position.x;
                const dzT = r.tz - r.body.position.z;
                const canFly = r.yw > WALL_HEIGHT + 0.2;
                let nx = r.body.position.x + dxT * remK;
                let nz = r.body.position.z + dzT * remK;
                if (dxT * dxT + dzT * dzT > REMOTE_SNAP_DIST2 && (canFly || !worldBlocked(r.tx, r.tz))) {
                    // 目标过远（复活/传送/长时间丢包后恢复）：直接吸附，避免"慢慢飘过去"的错位
                    nx = r.tx; nz = r.tz;
                } else if (!canFly && worldBlocked(nx, nz)) {
                    // 撞墙：停在原地（与既有行为一致）
                    nx = r.body.position.x; nz = r.body.position.z;
                }
                r.body.position.x = nx; r.body.position.z = nz;
                // 脸朝向玩家自己面对的方向，而不是一直盯着我
                r.body.rotation.y = (r.angle || 0) + Math.PI;
                // 高度平滑逼近：跟随 move 下发的高度（支持连跳飞高/飞越墙壁），
                // 再叠加一次起跳小抛物线，让旁人既能看见高度也能看见起跳动作
                r.yw += (r.tyw - r.yw) * remK;
                // 抬升量基准（当前所有角色统一贴地，为 0）
                const yBase = r.yw;
                let yh = yBase;
                if (r.jumpT) {
                    const et = (performance.now() - r.jumpT) / 1000;
                    if (et < 0.45) yh = yBase + Math.sin((et / 0.45) * Math.PI) * 1.1;
                    else r.jumpT = 0;
                }
                r.body.position.y = yh;
                // 远程手电筒：跟随玩家头部位置与朝向（angle），把灯光目标放到前方
                if (r.rLight) {
                    _rEuler.set(r.pitch || 0, r.angle || 0, 0, 'YXZ');
                    _rQuat.setFromEuler(_rEuler);
                    _fwdR.set(0, 0, -1).applyQuaternion(_rQuat);
                    // 光源沿"视线反方向"后移：贴着身体但不穿过去。
                    // 这样他背对我们时身体被自己的灯照亮；正对我们时是一圈亮光里的人影，
                    // 都不再需要我们自己拿灯去照他才能看见人。
                    rLightPos.set(r.body.position.x, yBase + 1.35, r.body.position.z).addScaledVector(_fwdR, -LIGHT_BACK_OFFSET);
                    r.rLight.position.copy(rLightPos);
                    r.rTarget.position.copy(rLightPos).add(_fwdR.multiplyScalar(8));
                    r.rLight.target.updateMatrixWorld();
                    applyRemoteFlash(r);
                }

                // 变身特效：收到 ghostfx 后的 2 秒是"前摇"（大量红光），变鬼之后只留微弱闪光。
                // 可见性与人物立牌同一规则：被照到 + 我看得见，否则整团不显示（不再有"漆黑里自己亮"）。
                // 只在"他可能有粒子"时才算亮度，空闲时一次墙体判定都不做。
                const fxHeavy = r.fxUntil > performance.now();
                const fxIdle = !fxHeavy && r.ghostImg;
                const fxOn = r.flash && (fxHeavy || fxIdle || r.fx.pts.visible);
                fxPump(r.fx, r.body.position.x, r.body.position.y, r.body.position.z, delta,
                       r.flash, fxHeavy, fxIdle,
                       fxOn ? cloudBrightness(r.body.position.x, r.body.position.y, r.body.position.z, r.flash, r.id) : 0);

                // 同步"本人是否开着手电"→ 余光微亮；精确的逐像素裁剪由材质按真实光照完成。
                if (revealOn) {
                    // 爆点：无视光照整块显现 + 关掉深度测试（穿墙可见），人本身就变成发光目标
                    if (r.uSpill) r.uSpill.value = 1;
                    if (r.body.material && r.body.material.depthTest !== false) {
                        r.body.material.depthTest = false;
                        r.body.material.needsUpdate = true;
                    }
                    r.body.visible = true;
                } else {
                    if (r.uSpill) r.uSpill.value = r.flash ? SPILL_ALPHA : 0;
                    if (r.body.material && r.body.material.depthTest !== true) {
                        r.body.material.depthTest = true;
                        r.body.material.needsUpdate = true;
                    }
                    r.body.visible = anyLightOn;
                }
                // 头顶名字牌：预备房全员可见；对局中默认隐藏，只有本端勾选「显示名字」才显示
                if (r.label) {
                    const showLabel = !inMatch || devShowNames;
                    if (r.label.visible !== showLabel) r.label.visible = showLabel;
                    if (showLabel) r.label.position.set(r.body.position.x, r.body.position.y + LABEL_UP, r.body.position.z);
                }
                // 爆点光柱：跟着人走，穿墙发光
                if (r.marker) {
                    if (r.marker.visible !== revealOn) r.marker.visible = revealOn;
                    if (revealOn) {
                        r.marker.position.set(r.body.position.x, r.body.position.y + 0.15, r.body.position.z);
                        const s = 2.4 + 0.3 * Math.sin(performance.now() / 180);
                        r.marker.scale.set(s, s, 1);
                    }
                }
            }

            // 雾浓度：随"场上有没有增强手电亮着"实时切换（每帧调用，只在值变化时才写）
            updateFogDensity();

            // 角色标识 + 鬼的刀人技能条（每帧调用，内部只在数值/文案变化时才碰 DOM）
            updateRoleTag();
            updateSkillUI();
            // 刀人瞄准提示 + 被刀红屏倒计时（同样每帧调用，只在变化时才碰 DOM）
            updateKnifeAim();
            updateRedKnifeUI();
            // 刀人 5 秒窗口的"正在击杀，还剩 X 秒"倒计时（同样只在秒数变化时才碰 DOM）
            updateKillCountdownUI();
            // 对局内角落卡片（30 秒周期显示 5 秒，只在变化时才碰 DOM）
            updateCornerCard();

            // 前摇结束（本地特效计时）：这里只收尾特效。
            // ⚠ 真正的换图由服务端在 2 秒整时广播 roleimg —— 所有人（包括自己）都在那一刻才变，
            //   所以"变身瞬间"是全局同步的，谁都不会多等一个网络往返。
            if (myTransformUntil && performance.now() >= myTransformUntil) myTransformUntil = 0;
            // 本机特效：以自己身体为中心（立牌本机不显示，但坐标是真的）。
            // 同样走"被照到才显示"：自己的灯亮＝被自己照亮，所以开关灯的观感与别人一致。
            const selfFxIdle = !myTransformUntil && myGhostImg && myGhost;
            const selfFxOn = flashOn && (!!myTransformUntil || selfFxIdle || selfFx.pts.visible);
            fxPump(selfFx, bodySprite.position.x, bodySprite.position.y, bodySprite.position.z, delta,
                   flashOn, !!myTransformUntil, selfFxIdle,
                   selfFxOn ? cloudBrightness(bodySprite.position.x, bodySprite.position.y, bodySprite.position.z, flashOn, MY_ID) : 0);

            // 本地手电筒：紧随相机位置与朝向
            flashLight.position.copy(camera.position);
            flashTarget.position.copy(camera.position).add(_cameraDir.set(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(8));
            flashLight.target.updateMatrixWorld();

            // 限制重绘帧率：120/144Hz 屏幕上没必要每帧重绘，跳过重复帧能省下近一半 GPU 开销，
            // 画面看不出差别（60Hz 屏幕每帧间隔都 >13ms，行为与原来完全一致）。
            const nowMs = performance.now();
            if (nowMs - lastRenderAt >= 13) {
                lastRenderAt = nowMs;
                fpsFrames += 1; // FPS 只统计真正重绘的帧
                renderer.render(scene, camera);
            }
        }

        remoteLightsReady = true;      // 场景就绪：允许档位切换去调整远端灯的阴影分辨率
        applyQuality(currentQuality);
        // ⚠ 用 setTimeout 而不是直接 animate()：
        //   直接调用会让"首帧"在本脚本剩余顶层代码之前执行 —— 任何写在 animate() 之后的
        //   let/const 一旦被首帧访问就会 "Cannot access 'X' before initialization"（TDZ）→ 整屏黑。
        //   推迟一个任务后，脚本顶层全部执行完才开始渲染，这类崩溃从结构上消失；
        //   而且即使后面某行顶层代码抛错，这一帧也已经排好队，画面不会一起黑掉。
        setTimeout(animate, 0);

        // ============================================================
        // 多人阶段一：角色选择 → 进入迷宫。选择界面已在后台运行，
        // three 与 2 张角色贴图先行加载（异步同构），就绪即启用按钮。
        // ============================================================
        const loader = new THREE.TextureLoader();
        // 缓存破坏版本号（改版时：此处 BUILD、界面 BUILD 一起 +1，并同步服务端 ASSET_VER）
        const BUILD = 58;
        // 立牌贴图：成员（默认）/ 鬼（按 E 切换后显示）。两种身份共用同一套资源，由服务器在对局开始时分配。
        const AVATAR_MEMBER = './assets/roles/person_filled.png?v=' + BUILD;
        const AVATAR_GHOST = './assets/roles/ghost_cut.png?v=' + BUILD;
        let avatarTexMember = null, avatarTexGhost = null;
        loader.load(AVATAR_MEMBER, (t) => { avatarTexMember = t; refreshAllAvatars(); }, undefined, () => {});
        loader.load(AVATAR_GHOST, (t) => { avatarTexGhost = t; refreshAllAvatars(); }, undefined, () => {});
        // 占位贴图（1x1 全透明）：角色贴图尚未加载完成时先用它，避免出现黑块
        const TEX_BLANK = (() => {
            const c = document.createElement('canvas'); c.width = 1; c.height = 1;
            return new THREE.CanvasTexture(c);
        })();
        function avatarTexFor(ghost, ghostImg) {
            if (ghost && ghostImg) return avatarTexGhost;
            return avatarTexMember;
        }
        function setRemoteAvatar(r) {
            const tex = avatarTexFor(r.ghost, r.ghostImg);
            if (tex) { r.body.material.map = tex; r.body.material.needsUpdate = true; }
        }
        function refreshAllAvatars() {
            for (const r of REMOTE.values()) setRemoteAvatar(r);
            applySelfAvatar();
        }

        // ----- 多人联机（/ws3d） -----
        function toWorld(g) { return g * CELL_SIZE + half - 0.5; }

        // ----- 左上角发言/广播显示区 -----
        const chatArea = document.createElement('div');
        chatArea.id = 'chatArea';
        document.body.appendChild(chatArea);
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function addMsg(html) {
            const el = document.createElement('div');
            el.className = 'msg';
            el.innerHTML = html;
            chatArea.appendChild(el);
            while (chatArea.children.length > 6) chatArea.removeChild(chatArea.firstChild);
        }
        function addBroadcast(text) {
            const el = document.createElement('div');
            el.className = 'msg broadcast';
            el.textContent = text;
            chatArea.appendChild(el);
            while (chatArea.children.length > 6) chatArea.removeChild(chatArea.firstChild);
        }

        // 受击提示：在底部中央（与开局操作提示同一位置）短暂显示"你被 XXX 攻击"，到时自动隐藏。
        // 隐藏前校验当前文案仍是本提示，避免把后出现的"点击画面恢复视角控制"等提示一并藏掉
        let statusHintTimer = null;
        function flashStatus(text, ms) {
            const h = document.getElementById('statusHint');
            if (!h) return;

        // ============================================================
        // 刀人·救助·胜负（客户端表现）：相机中心射线瞄准 / 左键触发 / 被刀红屏倒计时
        // ============================================================
        // 瞄准判定（与服务端 KNIFE_RANGE/KNIFE_HALF 对齐）：识别距离约 4.5 米；
        // 判定体积比立牌略大，约 2.4×2.4×1.4 世界单位（宽/高/深）
        const KNIFE_AIM_RANGE = 4.5;
        const KNIFE_HALF_W = 1.2;
        const KNIFE_HALF_H = 1.2;
        const KNIFE_HALF_D = 0.7;
        // 射线-AABB 相交（Slab 法）：命中返回近端 t（>=0），未命中返回 -1
        function rayAabbHit(cx, cy, cz, hw, hh, hd, o, d) {
            const minX = cx - hw, maxX = cx + hw;
            const minY = cy - hh, maxY = cy + hh;
            const minZ = cz - hd, maxZ = cz + hd;
            let tmin = 0, tmax = Infinity;
            for (let i = 0; i < 3; i++) {
                const oi = (i === 0) ? o.x : (i === 1) ? o.y : o.z;
                const di = (i === 0) ? d.x : (i === 1) ? d.y : d.z;
                const lo = (i === 0) ? minX : (i === 1) ? minY : minZ;
                const hi = (i === 0) ? maxX : (i === 1) ? maxY : maxZ;
                if (Math.abs(di) < 1e-8) {
                    if (oi < lo || oi > hi) return -1;
                } else {
                    let t1 = (lo - oi) / di;
                    let t2 = (hi - oi) / di;
                    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
                    if (t1 > tmin) tmin = t1;
                    if (t2 < tmax) tmax = t2;
                    if (tmin > tmax) return -1;
                }
            }
            return tmin;
        }
        const _aimOrigin = new THREE.Vector3();
        const _aimDir = new THREE.Vector3();
        // 每帧：指针锁定中才发射相机中心射线，对 ≤8 个远端做射线-AABB 相交（不做网格求交）
        function updateKnifeAim() {
            const lockedNow = knifeUntil > 0 && performance.now() < knifeUntil;
            // 鬼冷却关闭（开发者「鬼冷却」勾选）：本端直接视为就绪，无需等 10 秒充能
            const knifeReady = mySkillReady || devGhostNoCd;
            const canKnife = myGhost && myGhostImg && knifeReady && !lockedNow;
            const canRescue = !myGhost && !myRescueUsed && !!knifeVictim && knifeVictim !== MY_ID && !lockedNow && !(knifeBy === MY_ID);
            const hide = () => {
                if (knifeAimId !== null) knifeAimId = null;
                if (aimShownText) {
                    aimShownText = '';
                    const a = document.getElementById('knifeAim');
                    if (a) a.classList.remove('show');
                }
            };
            if (!gameStarted || gamePhase !== 'playing' || !inMatch || !document.pointerLockElement || (!canKnife && !canRescue)) { hide(); return; }
            // 相机中心射线：指针锁定时屏幕中心 = 相机前向
            _aimOrigin.copy(camera.position);
            _aimDir.set(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            let bestId = null;
            let bestT = KNIFE_AIM_RANGE + 1;
            for (const r of REMOTE.values()) {
                if (canKnife) {
                    // 鬼：只能瞄准"存活成员"（排除鬼/已死亡/自己）

                    // 成员：只能瞄准"被刀者 或 刀人的鬼"
                    if (r.id !== knifeVictim && r.id !== knifeBy) continue;
                }
                const t = rayAabbHit(r.body.position.x, r.body.position.y, r.body.position.z,
                                     KNIFE_HALF_W, KNIFE_HALF_H, KNIFE_HALF_D, _aimOrigin, _aimDir);
                if (t >= 0 && t <= KNIFE_AIM_RANGE && t < bestT) { bestT = t; bestId = r.id; }
            }
            if (!bestId) { hide(); return; }
            knifeAimId = bestId;
            const txt = canKnife ? '击杀他' : '救助他';
            const a = document.getElementById('knifeAim');
            if (a && txt !== aimShownText) {
                aimShownText = txt;
                a.textContent = txt;
                a.classList.add('show');
                a.classList.toggle('rescue', !canKnife);
            }
        }
        function hideAim() {
            if (knifeAimId !== null) knifeAimId = null;

        // 服务端此刻已把玩家移回 prep 房（youDied/escape 处理里 moveToPrep），本端延迟切换期间必须保持遮罩展示。

        // ----- 头顶名字牌 -----

        //（只影响自己这一端，其他人的画面完全不变）。
        const NAME_CW = 256, NAME_CH = 64;      // 名字牌画布尺寸
        const LABEL_UP = BODY_SIZE / 2 + 0.45;  // 名字牌相对立牌中心的抬高量
        function makeNameSprite() {

            const sp = new THREE.Sprite(mat);

                        mySkillMs = Number(m.ms) || 0;

                        const r = REMOTE.get(m.id);

                    }
                    else if (m.type === 'flash') {

                            if (!(enhancedFlash && !m.on)) flashOn = !!m.on;

                        flashBanned = !!m.on;

                        // 增强手电不受此影响（电量恒满，不会被强制熄灭）
                        if (enhancedFlash) { updateBatteryUI(100); }

                    else if (m.type === 'pull') {
