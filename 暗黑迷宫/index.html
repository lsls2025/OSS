                        if (m.id === MY_ID) {
                            const plX = Math.max(curMin(), Math.min(curMax(), Number(m.x)));
                            const plZ = Math.max(curMin(), Math.min(curMax(), Number(m.z)));
                            // 吸附目标若被墙挡住（服务端钳位误差），不套用，保持本地合法坐标防卡死
                            if (canMoveTo(plX, plZ)) {
                                px = plX; pz = plZ;
                                if (m.angle != null) playerAngle = Number(m.angle);
                                updatePlayerPosition();
                            }
                        } else {
                            const r = REMOTE.get(m.id);
                            if (r) {
                                const wx = toWorld(m.x), wz = toWorld(m.z);
                                // 吸附需瞬间到位：直接设远端身体 x/z，不经过 lerp
                                r.body.position.x = wx; r.body.position.z = wz;
                                if (m.angle != null) { r.angle = Number(m.angle); r.body.rotation.y = r.angle + Math.PI; }
                                r.tx = wx; r.tz = wz;
                                r.lastSeen = performance.now();
                            }
                        }
                    }
                    else if (m.type === 'chat') { addMsg(escapeHtml(m.text)); }
                    else if (m.type === 'escape') { addBroadcast(m.name + ' 成功离开了迷宫'); }
                    else if (m.type === 'knifed') {
                        // 全场广播：鬼已锁定某成员（5 秒刀人窗口，双方定身）
                        const kBy = String(m.by), kTg = String(m.target);
                        const kMs = Number(m.ms) || 5000;
                        knifeVictim = kTg; knifeBy = kBy;
                        if (kTg === MY_ID) {
                            // 我被刀：红屏 + 倒计时 + 定身（服务端还会私信 youAreKnifed，这里幂等）
                            knifeUntil = performance.now() + kMs;
                            showRedKnife(kMs);
                            // 被刀者视角：明确告诉他还剩几秒（配合红屏里的大号数字）
                            startKillCountdown(kMs, '正在被击杀，还剩 ', ' 秒');
                            const nm = remoteName(kBy);
                            flashStatus((nm ? nm : '鬼') + ' 正在靠近你', Math.min(kMs, 3000));
                        } else if (kBy === MY_ID) {
                            // 我是鬼：刀人发动成功，定身 5 秒 + 显示"击杀中 · 5 秒后完成"
                            knifeUntil = performance.now() + kMs;
                            startKillCountdown(kMs, '击杀中 · ', ' 秒后完成');
                        }
                        // 其他成员不给倒计时（只保留瞄准时的「救助他」提示），避免刷屏
                    }
                    else if (m.type === 'youAreKnifed') {
                        // 被刀者私信：红屏 + 倒计时（与 knifed 广播幂等）
                        const kMs = Number(m.ms) || 5000;
                        const kBy = String(m.by);
                        if (knifeBy !== kBy) knifeBy = kBy;
                        if (knifeVictim !== MY_ID) knifeVictim = MY_ID;
                        knifeUntil = performance.now() + kMs;
                        showRedKnife(kMs);
                        startKillCountdown(kMs, '正在被击杀，还剩 ', ' 秒'); // 与 knifed 广播幂等
                        const nm = remoteName(kBy);
                        flashStatus((nm ? nm : '鬼') + ' 正在靠近你', Math.min(kMs, 3000));
                    }
                    else if (m.type === 'knifeEnd') {
                        // 刀人结束：解除定身/红屏；reason: killed / rescued / gone
                        const kBy = String(m.by), kTg = String(m.target);
                        const kReason = String(m.reason || 'gone');
                        if (kTg === MY_ID || kBy === MY_ID) { knifeUntil = 0; hideRedKnife(); }
                        if (kTg === knifeVictim && kBy === knifeBy) { knifeVictim = null; knifeBy = null; }
                        knifeAimId = null; hideAim();
                        clearKillCountdown(); // 不论成败：刀人窗口结束，"还剩 X 秒"提示立刻收掉
                        if (kReason === 'rescued') rescueFailCount = Math.min(3, rescueFailCount + 1);
                        else if (kReason === 'killed') rescueFailCount = 0;
                    }
                    else if (m.type === 'lightsoff') {
                        // 全场（除鬼）手电被强制关闭一次：可手动重开（服务端已逐人发 flash 关灯，这里仅提示兜底）
                        if (!myGhost && !enhancedFlash) flashStatus('手电筒被强制关闭', 1500);
                    }
                    else if (m.type === 'membersWin') {
                        // 成员方全员胜利：本局结束、回预备房
                        showResult('成员方胜利', 'win');
                        resetKnifeLocal();
                        returnToPrep();
                    }
                    else if (m.type === 'youDied') {
                        // 5 秒无人救：被刀者死亡。先显示 5 秒过渡界面再回预备房
                        //（服务端此刻已把玩家挪进"过渡房"，本端延迟切换期间保持遮罩展示）
                        resetKnifeLocal();
                        showTransition('你已被击杀', 'die');
                    }
                    else if (m.type === 'ghostWin') {
                        // 鬼方获胜：对局房里已经没有成员了（全部被击杀 / 全部逃出）→ 本局结束
                        resetKnifeLocal();
                        addBroadcast('本局结束：鬼获胜');
                        // 自己已在死亡/逃脱的 5 秒过渡里：保留自己的过渡，不打断、不重复弹层
                        if (!transitionActive) {
                            if (inMatch) showTransition('鬼获胜', 'win'); // 局内参与者（就是鬼）：5 秒过渡后回预备房
                            else showResult('本局结束：鬼获胜', 'die');    // 预备房旁观者：只提示一句
                        }
                    }
                    else if (m.type === 'revealAll') {
                        // 全员爆点：狼人（鬼）与发起者本人在 5 秒内看到所有人的位置（穿墙发光）
                        revealUntil = performance.now() + (Number(m.ms) || 5000);
                        revealByMe = (String(m.by) === String(MY_ID));
                        revealTargetId = null; // 全员：不挑人
                        if (myGhost || revealByMe) addBroadcast('全员爆点：5 秒内可见所有人位置');
                    }
                    else if (m.type === 'revealOne') {
                        // 单爆（报点）：只有被点名的那个人被狼人看到（穿墙发光），其他人不亮
                        revealUntil = performance.now() + (Number(m.ms) || 5000);
                        revealByMe = (String(m.by) === String(MY_ID));
                        revealTargetId = String(m.target);
                        if (myGhost || revealByMe) addBroadcast('单人报点：5 秒内可见该玩家位置');
                    }
                    else if (m.type === 'exposed') {
                        // 我被报点了（全员爆点或单爆）：明确提示"位置已暴露"
                        flashStatus('你的位置已暴露', Number(m.ms) || 5000);
                    }
                    else if (m.type === 'playerlist') {
                        // 单踢/单爆的候选名单（服务端下发，含对局房与预备房的所有在线玩家）
                        pickList = (m.players || []).filter(q => q.id !== MY_ID);
                        pickLoaded = true;
                        renderPickList();
                    }
                    else if (m.type === 'jump') { const r = REMOTE.get(m.id); if (r) r.jumpT = performance.now(); }
                    else if (m.type === 'kickout') {
                        // 被踢出服务器：回到选角色主界面，清空本地数据，不再重连。
                        // 带 until = "单踢"的 10 分钟封禁：写进本地缓存，之后无论怎么刷新都进不去
                        if (m.until && window.__showKicked) window.__showKicked(Number(m.until));
                        connStopped = true;
                        if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
                        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                        if (MY_WS === ws) { MY_WS = null; MY_ID = null; MY_NAME = myRoleName; }
                        if (CLIENT_TOKEN) { window.__store.session.del('ls3d_token'); CLIENT_TOKEN = ''; }
                        returnToLobby();
                    }
                };
                ws.onerror = () => {
                    if (MY_WS && MY_WS !== ws) return; // 已被新连接替换的旧 socket：忽略，避免多计失败/误改状态
                    connecting = false;
                    if (connectWatchdog) { clearTimeout(connectWatchdog); connectWatchdog = null; }
                    if (connStopped) return;
                    const h = document.getElementById('statusHint');
                    if (h) h.textContent = '联机未建立：正在尝试重连…';
                    noteFailure('error');
                };
                ws.onclose = () => {
                    if (MY_WS && MY_WS !== ws) return; // 已被新连接替换的旧 socket：忽略，避免误清状态/多计失败
                    connecting = false;
                    if (connectWatchdog) { clearTimeout(connectWatchdog); connectWatchdog = null; }
                    if (connStopped) return; // 已回主界面/被踢：只收尾，不再提示与重连
                    const h = document.getElementById('statusHint');
                    if (h) h.textContent = '联机已断开，正在重连…';
                    noteFailure('close');
                };
            }
            function maybeBackToLobby() {
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                connStopped = true;  // 停止一切重连
                // 连续重连失败：不再重连，清空本地数据回到选角色主界面（token 保留，重新进入可恢复身份）
                returnToLobby();
            }
            // 退避重试：第 n 次失败后等待 RECONNECT_DELAYS[n-1]，超过末位则按末位等待
            function scheduleReconnect() {
                if (connStopped || reconnectTimer) return;
                const idx = Math.max(0, Math.min(reconnectFails - 1, RECONNECT_DELAYS.length - 1));
                reconnectTimer = setTimeout(() => { reconnectTimer = null; openConn(); }, RECONNECT_DELAYS[idx]);
            }
            // 页面切回可见时，若连接断开立即重连（连接中/已连接时不重复触发，避免双连接）
            // 重复进入游戏时先摘掉上一次会话的监听，避免多个闭包叠加互相抢占连接
            if (mpVisibilityHandler) document.removeEventListener('visibilitychange', mpVisibilityHandler);
            mpVisibilityHandler = () => {
                if (document.visibilityState === 'visible') {
                    const ws = MY_WS;
                    if (!ws) { openConn(); return; }
                    if (ws.readyState === 0 || ws.readyState === 1) return;
                    openConn();
                }
            };
            document.addEventListener('visibilitychange', mpVisibilityHandler);
            // 网络恢复（弱网/移动网络切换很常见）：立即重连并重置退避，不必干等定时器
            if (mpOnlineHandler) window.removeEventListener('online', mpOnlineHandler);
            mpOnlineHandler = () => {
                if (connStopped) return;
                reconnectFails = 0;
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                const ws = MY_WS;
                if (!ws || ws.readyState === 2 || ws.readyState === 3) openConn();
            };
            window.addEventListener('online', mpOnlineHandler);
            openConn();
            // 定期上报自己的位置（每次进入游戏重建，先清掉上一次的定时器，避免重复上报）。
            // 静止时不再空转上报：既省流量，也把服务端的转发量从"每人每秒 12.5 条"降到接近 1 条，
            // 但至少每 1 秒保底发一次，确保刚进房/重连后服务端一定能拿到坐标。
            let lastSentX = NaN, lastSentZ = NaN, lastSentA = NaN, lastSentY = NaN, lastSentP = NaN, lastSentAt = 0;
            // 上报抽成一个函数：定时器按节流发；landImmediately() 需要"立即"发（force=true）绕过节流，
            // 保证切标签页/失焦落地的那一刻服务端就能拿到地面高度，别人不会看到你停留空中。
            function reportMoveNow(force) {
                if (!(MY_WS && MY_WS.readyState === 1)) return;
                const nowMs = Date.now();
                const rx = Math.round(px * 100) / 100;
                const rz = Math.round(pz * 100) / 100;
                const ra = Math.round(playerAngle * 100) / 100;
                const rp = Math.round(pitchAngle * 100) / 100;
                // 上报立牌中心高度（= 立牌尺寸的一半）＋腾空高度；远端把它直接当立牌中心使用，
                // 所以改尺寸时这里必须跟着变，否则别人会看到你的立牌离地或陷进地里。
                const ry = Math.round((BODY_CENTER_Y + yOffset) * 100) / 100;
                if (!force && rx === lastSentX && rz === lastSentZ && ra === lastSentA && ry === lastSentY && rp === lastSentP && nowMs - lastSentAt < 1000) return;
                lastSentX = rx; lastSentZ = rz; lastSentA = ra; lastSentY = ry; lastSentP = rp; lastSentAt = nowMs;
                MY_WS.send(JSON.stringify({ type: 'move', x: rx, z: rz, angle: ra, y: ry, p: rp }));
            }
            // 暴露给 landImmediately()：切后台/失焦落地后立刻上报新高度
            forceReportMove = function () { reportMoveNow(true); };
            if (mpMoveTimer) clearInterval(mpMoveTimer);
            mpMoveTimer = setInterval(function () { reportMoveNow(false); }, 80);
        }
        // 左上角在线人数 = 自己 + 在线的其他玩家
        function onlineRefresh(list, online) {
            const el = document.getElementById('onlineInfo');
            if (!el) return;
            // 优先用服务器下发的权威在线数（只算存活的连接，断连已剔除）
            if (online != null && Number.isFinite(Number(online))) { el.textContent = Math.max(1, Number(online)); return; }
            if (Array.isArray(list) && list.length) { el.textContent = list.length; return; }
            el.textContent = MY_ID ? (REMOTE.size + 1) : 1;
        }

        // 房间开启计时显示：起点由服务端下发（全员共享），本地只做格式化与刷新。
        // 服务端没给起点（房间空/未连接）时显示 --:--
        const roomTimerEl = document.getElementById('roomTimer');
        function fmtDuration(ms) {
            const s = Math.max(0, Math.floor(ms / 1000));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const ss = s % 60;
            const pad = n => (n < 10 ? '0' : '') + n;
            return h > 0 ? (h + ':' + pad(m) + ':' + pad(ss)) : (pad(m) + ':' + pad(ss));
        }
        setInterval(function () {
            if (!roomTimerEl) return;
            // 计时器：仅在对局房（gamePhase=playing）显示本局已用时；预备房恒显示 00
            roomTimerEl.textContent = (inGame && matchStart) ? fmtDuration(Date.now() - matchStart) : '00';
        }, 500);

        // 返回选角色主界面：清空本地所有联机状态，停止游戏捕获，移除 token 记忆（"踢掉所有人"/重连失败用）
        function returnToLobby() {
            if (document.pointerLockElement) document.exitPointerLock();
            if (hijackTimer) { clearInterval(hijackTimer); hijackTimer = null; } // 回大厅：停掉开局劫持/10 秒缓冲倒计时
            const gso = document.getElementById('gameStartOverlay');
            if (gso) gso.classList.remove('show');
            const gsk = document.getElementById('gsKeys');
            if (gsk) gsk.innerHTML = '';
            // 清空本地染发状态与远端
            escaped = false; gameStarted = false; joinedPrep = false; inGame = false;
            gamePhase = 'prep'; matchStart = null; // 回大厅：复位对局状态，下次进入重新走预备房
            revealUntil = 0; revealByMe = false; // 回大厅：结束"全员爆点"
            roomStart = null; // 离开房间：计时显示复位
            // 清空全员锁定状态与提示条
            lockAllActive = false; lockAllSelf = false; setLockAllHint(false);
            // 回大厅：清掉刀人红屏/瞄准/结果提示与计数
            resetKnifeLocal(); hideResult();
            hideTransition(); // 回大厅：清掉死亡/逃脱过渡界面（含倒计时定时器）
            cornerCardShown = false; cornerCardNextAt = 0; cornerCardHideAt = 0; // 回大厅：停止并隐藏角落卡片
            const cornerEl = document.getElementById('cornerCard');
            if (cornerEl) cornerEl.classList.remove('show');
            // 逐个走 removeRemote：立牌、远端灯、特效、头顶名字牌、爆点光柱一并从场景移除，
            // 避免鬼影/游离名字牌残留在场景里（只 scene.remove(body) 会漏掉这些附着物）
            for (const rid of Array.from(REMOTE.keys())) removeRemote(rid);
            REMOTE.clear();
            const h = document.getElementById('statusHint');
            if (h) h.textContent = '';
            // 回到主界面：显示选角色面板，并恢复"进入迷宫"按钮（进入游戏时曾禁用以防重复连接）
            const overlayEl = document.getElementById('roleOverlay');
            if (overlayEl) { overlayEl.style.display = 'flex'; overlayEl.classList.remove('prep'); }
            const eb = document.getElementById('enterBtn');
            if (eb) eb.disabled = false;
        }

        // 开始游戏时的全屏劫持：屏幕被抢占，先 5 秒倒计时，再等待服务端分配身份
        function startMatchHijack() {
            inMatch = true;
            hijacked = true;
            // 角落卡片（当前位置 + 双出口）不在此时启动：此刻身份还没公布，谁都不知道自己是不是鬼。
            // 它只是给成员认路用的帮助，等 matchReveal 公布身份后只对"成员"启动，鬼不看。
            cornerCardNextAt = 0;
            // 清空按住的移动/跳跃键与腾空状态，避免劫持期间带着旧输入继续漂移
            keys.w = keys.a = keys.s = keys.d = false;
            keys.up = keys.down = keys.left = keys.right = false;
            sprintKey = false; spaceHeld = false;
            yOffset = 0; vy = 0; groundedRef = true;
            updateMidBanner(); // 进入对局房后不再显示"等待对局结束"横幅
            if (document.pointerLockElement) document.exitPointerLock();
            const ov = document.getElementById('gameStartOverlay');
            if (ov) {
                const title = document.getElementById('gsTitle');
                const count = document.getElementById('gsCount');
                const sub = document.getElementById('gsSub');
                const role = document.getElementById('gsRole');
                if (title) title.textContent = '对局即将开始，请准备好';
                if (sub) { sub.textContent = ''; sub.classList.remove('gs-dots'); }
                if (role) { role.textContent = ''; role.className = 'gs-role'; }
                const keysEl = document.getElementById('gsKeys');
                if (keysEl) keysEl.innerHTML = '';
                if (count) { count.style.display = ''; count.textContent = 5; }
                ov.classList.add('show');
            }
            if (hijackTimer) clearInterval(hijackTimer);
            let n = 5;
            hijackTimer = setInterval(() => {
                n--;
                const count = document.getElementById('gsCount');
                if (n <= 0) {
                    if (hijackTimer) { clearInterval(hijackTimer); hijackTimer = null; }
                    if (count) count.style.display = 'none';
                } else if (count) {
                    count.textContent = n;
                }
            }, 1000);
        }
        // 5 秒后：提示"正在随机分配鬼"
        function matchRollGhost() {
            const sub = document.getElementById('gsSub');
            const count = document.getElementById('gsCount');
            if (count) count.style.display = 'none';
            if (sub) { sub.textContent = '正在随机分配鬼'; sub.classList.add('gs-dots'); }
        }
        // 10 秒后：揭示真实身份（鬼/成员），随后进入 10 秒操作提示缓冲期，缓冲结束才真正开始游戏
        function matchReveal(ghostId) {
            if (hijackTimer) { clearInterval(hijackTimer); hijackTimer = null; }
            const sub = document.getElementById('gsSub');
            const role = document.getElementById('gsRole');
            const count = document.getElementById('gsCount');
            const keys = document.getElementById('gsKeys');
            if (sub) { sub.classList.remove('gs-dots'); sub.textContent = ''; }
            myGhost = (MY_ID === ghostId);
            inGame = true;
            matchStart = Date.now();
            if (role) {
                if (myGhost) { role.textContent = '你的身份是鬼'; role.className = 'gs-role ghost'; }
                else { role.textContent = '你的身份是成员'; role.className = 'gs-role member'; }
            }
            // 身份公布后 10 秒缓冲：按身份分开显示操作提示 ——
            // 成员只看到 Q（手电筒）；鬼额外看到 E（变身），两条提示独立成行、绝不混在一起。
            if (keys) {
                keys.innerHTML = '';
                const qk = document.createElement('div');
                qk.className = 'gs-key ' + (myGhost ? 'ghost' : 'member');
                qk.innerHTML = '<b>Q</b> 键：打开手电筒';
                keys.appendChild(qk);
                if (myGhost) {
                    const ek = document.createElement('div');
                    ek.className = 'gs-key ghost';
                    ek.innerHTML = '<b>E</b> 键：变身为鬼';
                    keys.appendChild(ek);
                }
            }
            applySelfAvatar();
            // 身份公布：位置/出口卡片只给成员（它是帮成员认路的，鬼不需要这类帮助）。
            // 但 10 秒缓冲期先不启动角落卡片，让操作提示独占屏幕；真正开始后再显示首次。
            if (myGhost) { cornerCardNextAt = 0; cornerCardHideAt = 0; hideCornerCard(); }
            else cornerCardNextAt = 0; // 10 秒缓冲结束后再置 performance.now()
            // 10 秒缓冲倒计时：期间 hijacked 保持 true（禁移动/跳跃/变身/手电），倒计时结束才真正开始游戏
            if (count) { count.style.display = ''; count.textContent = 10; }
            let n = 10;
            hijackTimer = setInterval(() => {
                n--;
                const c2 = document.getElementById('gsCount');
                const k2 = document.getElementById('gsKeys');
                if (n <= 0) {
                    if (hijackTimer) { clearInterval(hijackTimer); hijackTimer = null; }
                    if (c2) c2.style.display = 'none';
                    if (k2) k2.innerHTML = '';
                    const ov = document.getElementById('gameStartOverlay');
                    if (ov) ov.classList.remove('show');
                    hijacked = false;
                    if (!myGhost) cornerCardNextAt = performance.now(); // 成员：真正开始后立即显示首次位置/出口卡片
                    if (gameStarted && !document.pointerLockElement) tryEnterPointerLock();
                } else if (c2) {
                    c2.textContent = n;
                }
            }, 1000);
        }
        // 结束游戏：全员从"对局房"回到"预备房"（仍在同一个迷宫里自由活动，连接不中断，等待下一局）
        function returnToPrep() {
            inGame = false; inMatch = false; gamePhase = 'prep'; matchStart = null;
            hijacked = false; myGhost = false; myGhostImg = false; myTransformUntil = 0;
            escaped = false;
            revealUntil = 0; revealByMe = false; // 回预备房：结束"全员爆点"
            lockAllActive = false; lockAllSelf = false; setLockAllHint(false);
            resetKnifeLocal(); hideResult(); // 回预备房：清掉刀人红屏/瞄准/结果提示与计数
            hideTransition(); // 回预备房：清掉死亡/逃脱过渡界面（含倒计时定时器）
            cornerCardShown = false; cornerCardNextAt = 0; cornerCardHideAt = 0; // 回预备房：停止并隐藏角落卡片
            const el2 = document.getElementById('cornerCard');
            if (el2) el2.classList.remove('show');
            const ov = document.getElementById('gameStartOverlay');
            if (ov) ov.classList.remove('show');
            if (hijackTimer) { clearInterval(hijackTimer); hijackTimer = null; }
            updateMidBanner();
            applySelfAvatar();
        }
        // 中途加入且对局进行中：在顶部显示"等待对局结束"横幅；其余情况（已在对局/预备房空闲）隐藏
        function updateMidBanner() {
            const b = document.getElementById('matchBanner');
            if (!b) return;
            if (gamePhase === 'playing' && !inMatch) b.classList.add('show');
            else b.classList.remove('show');
        }
        // 开发者面板里的对局阶段指示 + 开始/结束按钮的可用态
        function updateDevPhase() {
            const el = document.getElementById('devPhase');
            if (!el) return;
            if (gamePhase === 'playing') { el.textContent = '当前：对局进行中'; el.style.color = '#ff9a9a'; }
            else { el.textContent = '当前：预备房'; el.style.color = '#9fb4d8'; }
            const sb = document.getElementById('devStartGame'); if (sb) sb.disabled = (gamePhase === 'playing');
            const eb = document.getElementById('devEndGame'); if (eb) eb.disabled = (gamePhase !== 'playing');
        }

        // ============================================================
        // 开发者模式：双击 Shift 呼出（首次需输入密码 LS，之后免输）；与"开发者头像"角色卡密码 LSnb666 完全隔离
        // ============================================================
        const passOverlay = document.getElementById('passOverlay');
        const devOverlay = document.getElementById('devOverlay');
        const passInput = document.getElementById('passInput');
        const devNoClipEl = document.getElementById('devNoClip');
        const devBhopEl = document.getElementById('devBhop');
        const devStaminaEl = document.getElementById('devStamina');
        const devFlashEl = document.getElementById('devFlash');
        const devFlashBanEl = document.getElementById('devFlashBan');
        const devLockAllEl = document.getElementById('devLockAll');
        const devGhostCdEl = document.getElementById('devGhostCd');
        const devShowNamesEl = document.getElementById('devShowNames');
        const devSpeedEl = document.getElementById('devSpeed');
        const devCloseEl = document.getElementById('devClose');

        function openPassModal() {
            if (document.pointerLockElement) document.exitPointerLock();
            passOverlay.style.display = 'flex';
            setTimeout(() => passInput.focus(), 20);
        }
        function closePassModal() { passOverlay.style.display = 'none'; passInput.value = ''; }

        // 密码验证成功后要执行的回调（预留）；当前始终为空 → 密码通过即打开开发者面板
        let passOnSuccess = null;
        // 密码提交后等待服务端验证的暂存状态（密码仅由用户输入，代码中不出现明文）
        let pendingDevMode = false, pendingRoleCardFn = null;
        // 授权开发者身份：置位本地授权标记（密码验证由服务端完成）
        function grantDev() { devAuthorized = true; }
        function openDevPanel() {
            devAuthorized = true; // 已授权：之后快捷键始终生效，无需重开弹窗
            if (document.pointerLockElement) document.exitPointerLock();
            devNoClipEl.checked = noclip;
            devBhopEl.checked = bhop;
            devStaminaEl.checked = staminaUnlimited;
            devFlashEl.checked = enhancedFlash;
            devFlashBanEl.checked = flashBanned;
            devLockAllEl.checked = lockAllSelf;
            devGhostCdEl.checked = devGhostNoCd;
            devShowNamesEl.checked = devShowNames;
            devSpeedEl.value = speedMult;
            devOverlay.style.display = 'flex';
            updateDevPhase(); // 打开即按当前对局阶段刷新指示与按钮可用态
        }
        function closeDevPanel() { devOverlay.style.display = 'none'; }
        function openDevEntry() {
            // 隔离：游戏内打开开发者密码弹窗时，清掉角色选择可能残留的回调，防止劫持本流程
            passOnSuccess = null;
            // 每次进入均需输入密码，由服务端校验（密码经环境变量注入，不落前端代码）
            openPassModal();
        }
        passInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                const pwd = passInput.value.trim(); // 原样提交，由服务端比对环境变量中的密码（前端不内置明文密码）
                const fn = passOnSuccess; // 角色选择路径才有此回调；游戏内路径为 null
                passOnSuccess = null;
                closePassModal();
                if (!pwd || !MY_WS || MY_WS.readyState !== 1) return;
                pendingDevMode = !fn;      // 角色卡路径只选中角色，不进入开发者模式
                pendingRoleCardFn = fn;
                MY_WS.send(JSON.stringify({ type: 'devlogin', pwd }));
            }
            if (e.key === 'Escape') { passOnSuccess = null; closePassModal(); }
        });
        devCloseEl.addEventListener('click', closeDevPanel);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // ESC 依次关闭 选人弹窗 / 开发者面板 / 密码弹窗，才不会卡住
                if (pickOverlayEl && pickOverlayEl.style.display === 'flex') { closePick(); e.preventDefault(); }
                else if (devOverlay.style.display === 'flex') { closeDevPanel(); e.preventDefault(); }
                else if (passOverlay.style.display === 'flex') { passOnSuccess = null; closePassModal(); e.preventDefault(); }
            }
        });
        devNoClipEl.addEventListener('change', () => { noclip = devNoClipEl.checked; });
        devBhopEl.addEventListener('change', () => { bhop = devBhopEl.checked; });
        devStaminaEl.addEventListener('change', () => {
            staminaUnlimited = devStaminaEl.checked;
            // 开启即补满体力，体力栏实时可见
            if (staminaUnlimited) { stamina = STAMINA_MAX; updateStaminaUI(stamina); }
        });
        devFlashEl.addEventListener('change', () => {
            enhancedFlash = devFlashEl.checked;
            if (enhancedFlash) {
                // 勾选即点亮并应用增强，电量锁定满格
                window.__setFlash(true);
                updateBatteryUI(100);
            }
            applyFlash();
            sendEnhancedFlash();
        });
        function sendEnhancedFlash() {
            if (MY_WS && MY_WS.readyState === 1) {
                MY_WS.send(JSON.stringify({ type: 'setenhancedflash', on: enhancedFlash }));
            }
        }
        devFlashBanEl.addEventListener('change', () => { sendDevFlashBan(devFlashBanEl.checked); });
        function sendDevFlashBan(on) {
            // 禁用手电（开发者专用）：开启后服务端强制除开发者本人外的所有人关灯且不可再开
            if (MY_WS && MY_WS.readyState === 1) {
                MY_WS.send(JSON.stringify({ type: 'setflashban', on: !!on }));
            }
        }
        devLockAllEl.addEventListener('change', () => {
            lockAllSelf = devLockAllEl.checked;
            sendLockAll(lockAllSelf);
            // 锁定者本人豁免移动限制（自己仍可正常移动/跳跃），且不显示"全员锁定"提示
            lockAllActive = false;
            setLockAllHint(false);
        });
        function sendLockAll(on) {
            // 全员锁定（开发者专用）：开启后服务端冻结除开发者本人外的所有玩家（视角仍可翻转）
            if (MY_WS && MY_WS.readyState === 1) {
                MY_WS.send(JSON.stringify({ type: 'setlockall', on: !!on }));
            }
        }
        devGhostCdEl.addEventListener('change', () => {
            // 「鬼冷却」：只对本端玩家生效。我是鬼时无需 10 秒充能即可刀人；
            // 我若不是鬼，勾选后仅本地标记，实际无任何效果（服务端同样只接受鬼的刀人）。
            devGhostNoCd = devGhostCdEl.checked;
            if (MY_WS && MY_WS.readyState === 1) {
                MY_WS.send(JSON.stringify({ type: 'setghostcd', on: devGhostNoCd }));
            }
        });
        devSpeedEl.addEventListener('change', () => {
            let v = parseFloat(devSpeedEl.value);
            if (!isFinite(v) || v < 0.1) v = 1;
            speedMult = Math.min(20, Math.max(0.1, v));
            devSpeedEl.value = speedMult;
        });
        // 吸附：把所有人拉到我当前坐标
        document.getElementById('devPullAll').addEventListener('click', () => {
            if (!MY_WS || MY_WS.readyState !== 1) { addBroadcast('联机未建立，无法吸附'); return; }
            MY_WS.send(JSON.stringify({ type: 'pullall', x: Math.round(px * 100) / 100, z: Math.round(pz * 100) / 100 }));
        });

        // 显示名字（仅本端生效）：对局中也显示所有人的头顶名字；其他人画面不受影响
        document.getElementById('devShowNames').addEventListener('change', () => {
            devShowNames = document.getElementById('devShowNames').checked;
        });
        // 全员爆点：5 秒内狼人（鬼）能看到所有人所在位置（穿墙发光）
        document.getElementById('devRevealAll').addEventListener('click', () => {
            if (!devAuthorized) return;
            if (!MY_WS || MY_WS.readyState !== 1) { addBroadcast('联机未建立，无法全员爆点'); return; }
            MY_WS.send(JSON.stringify({ type: 'revealall' }));
        });

        // ----- 单踢 / 单爆：先从服务端拿到"全部在线玩家"名单，再选一个人 -----
        // 名单由服务端下发，所以不管对方在局内还是局外（预备房）都能看到并操作。
        const pickOverlayEl = document.getElementById('pickOverlay');
        const pickTitleEl = document.getElementById('pickTitle');
        const pickListEl = document.getElementById('pickList');
        const pickActionEl = document.getElementById('pickAction');
        const pickCancelEl = document.getElementById('pickCancel');
        let pickMode = 'kick';   // 'kick' 单踢 | 'reveal' 单爆（报点）
        let pickId = null;       // 当前选中的玩家 id
        let pickList = [];       // 服务端下发的在线玩家 [{id,name,room}]
        let pickLoaded = false;  // 名单是否已到（区分"读取中"与"真的没人"）
        function roomLabel(room) {
            if (room === 'match') return '（对局中）';
            if (room === 'limbo') return '（离场中）';
            return '（预备房）';
        }
        function renderPickList() {
            if (!pickListEl) return;
            pickListEl.innerHTML = '';
            if (!pickList.length) {
                const d = document.createElement('div');
                d.className = 'pick-empty';
                d.textContent = pickLoaded ? '当前没有其他在线玩家' : '正在读取在线玩家…';
                pickListEl.appendChild(d);
                return;
            }
            for (const q of pickList) {
                const row = document.createElement('div');
                row.className = 'pick-row' + (q.id === pickId ? ' on' : '');
                row.textContent = q.name + roomLabel(q.room);
                row.addEventListener('click', () => {
                    pickId = q.id;
                    if (pickActionEl) pickActionEl.disabled = false;
                    renderPickList();
                });
                pickListEl.appendChild(row);
            }
        }
        function openPick(mode) {
            if (!devAuthorized) return;
            if (!MY_WS || MY_WS.readyState !== 1) { addBroadcast('联机未建立，无法操作'); return; }
            pickMode = mode; pickId = null; pickList = []; pickLoaded = false;
            if (pickTitleEl) pickTitleEl.textContent = (mode === 'kick') ? '选择要踢出的玩家' : '选择要报点的玩家';
            if (pickActionEl) {
                pickActionEl.textContent = (mode === 'kick') ? '踢' : '报点';
                pickActionEl.disabled = true;
            }
            renderPickList();
            if (pickOverlayEl) pickOverlayEl.style.display = 'flex';
            MY_WS.send(JSON.stringify({ type: 'playerlist' })); // 名单由服务端给（跨房间可见）
        }
        function closePick() { if (pickOverlayEl) pickOverlayEl.style.display = 'none'; }
        if (pickCancelEl) pickCancelEl.addEventListener('click', closePick);
        if (pickActionEl) pickActionEl.addEventListener('click', () => {
            if (!pickId || !MY_WS || MY_WS.readyState !== 1) return;
            // 单踢：踢出服务器并拉黑 10 分钟（本地缓存判定，不封 IP）
            // 单爆：只让狼人看到这一个人的位置，其他人不亮
            MY_WS.send(JSON.stringify({ type: (pickMode === 'kick') ? 'kickone' : 'revealone', target: pickId }));
            closePick();
        });
        // 单踢：踢掉某一个人（10 分钟封禁，客户端本地缓存判定）
        document.getElementById('devKickOne').addEventListener('click', () => { openPick('kick'); });
        // 单爆（报点）：只把某一个人的位置报给狼人
        document.getElementById('devRevealOne').addEventListener('click', () => { openPick('reveal'); });

        // 开始游戏 / 结束游戏（开发者专用）：经服务端权威切换对局阶段，全员同步跳转
        document.getElementById('devStartGame').addEventListener('click', () => {
            if (!devAuthorized) return;
            if (!MY_WS || MY_WS.readyState !== 1) { addBroadcast('联机未建立，无法开始游戏'); return; }
            MY_WS.send(JSON.stringify({ type: 'startgame' }));
        });
        document.getElementById('devEndGame').addEventListener('click', () => {
            if (!devAuthorized) return;
            if (!MY_WS || MY_WS.readyState !== 1) { addBroadcast('联机未建立，无法结束游戏'); return; }
            MY_WS.send(JSON.stringify({ type: 'endgame' }));
        });
        updateDevPhase(); // 初始化对局阶段指示与按钮可用态

        // 快速连按 3 下 Shift 才弹出开发者弹窗；长按(按住>=shortTapMax)只用来奔跑，绝不触发
        let shiftHeld = false;
        let shiftDownTime = 0;
        let sTapCount = 0;        // 已累计的短按次数
        let sLastTapUp = 0;       // 上一次短按松开时刻
        const tapGapMax = 250;    // 相邻两次短按之间的最大间隔 (ms)
        const shortTapMax = 180;  // 单次按住最长时长，超过即视为长按(奔跑)，丢弃
        const needTaps = 3;       // 需要连按几次才弹出
        const isShiftKey = (e) => (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight');
        document.addEventListener('keydown', (e) => {
            if (!isShiftKey(e)) return;
            if (e.repeat) return;       // 忽略系统自动重复
            if (shiftHeld) return;      // 已按住：不重复计入
            shiftHeld = true;
            shiftDownTime = Date.now();
        });
        document.addEventListener('keyup', (e) => {
            if (!isShiftKey(e)) return;
            if (!shiftHeld) return;
            const now = Date.now();
            const heldMs = now - shiftDownTime;
            shiftHeld = false;
            // 长按(>=shortTapMax)：用于奔跑，直接清空计数返回，绝不计数
            if (heldMs >= shortTapMax) { sTapCount = 0; return; }
            // 短按：如果与上一次短按时间隔太久，说明不是连击，重新计数
            if (sLastTapUp > 0 && (now - sLastTapUp) > tapGapMax) sTapCount = 0;
            sLastTapUp = now;
            sTapCount++;
            // 连续 3 次短按 → 弹出，并清空计数
            if (sTapCount >= needTaps) { sTapCount = 0; openDevEntry(); }
        });
        // 由选择界面调用：应用角色贴图 + 昵称，并进入迷宫
        window.__startGame = function () {
            // 幂等保护：重复点击会建立第二条同 token 连接，导致身份被抢占/在他人视角制造分身
            if (joinedPrep) return;
            joinedPrep = true;
            const enterBtnEl = document.getElementById('enterBtn');
            if (enterBtnEl) enterBtnEl.disabled = true; // 已进入预备房，禁止重复进入
            applySelfAvatar(); // 默认成员立牌（鬼在身份分配后按 E 才切换）
            // 直接进入迷宫（即"预备房"：在同一个地图里自由活动，等待开发者开始游戏；没有停留等待界面）
            gameStarted = true; // 进入迷宫后才允许鼠标捕获转视角
            document.getElementById('roleOverlay').style.display = 'none';
            connectMultiplayer();
        };
    </script>
</body>
